name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build-and-release:
    name: Build macOS arm64 and publish release
    needs: test
    # macos-14+ standard runners are Apple Silicon — no paid runners needed.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match apps/desktop version $PKG."
            echo "Run: node scripts/set-version.mjs $TAG  and re-tag."
            exit 1
          fi

      - name: Build desktop bundles
        run: npm run build -w @arnega/desktop

      - name: Package DMG and ZIP (unsigned public build)
        working-directory: apps/desktop
        env:
          # No signing certificates in CI: skip identity discovery so
          # electron-builder produces the documented unsigned build.
          # For a future signed build, provide CSC_LINK / CSC_KEY_PASSWORD
          # secrets instead — see docs/MACOS-DISTRIBUTION.md.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          cp "apps/desktop/release/ArNega-${VERSION}-mac-arm64.dmg" dist-release/
          cp "apps/desktop/release/ArNega-${VERSION}-mac-arm64.zip" dist-release/
          # Stable-named aliases so the website's permanent
          # /releases/latest/download/ links keep working every release.
          cp "dist-release/ArNega-${VERSION}-mac-arm64.dmg" dist-release/ArNega-mac-arm64.dmg
          cp "dist-release/ArNega-${VERSION}-mac-arm64.zip" dist-release/ArNega-mac-arm64.zip
          cd dist-release
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArNega ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
          body: |
            ## ArNega ${{ github.ref_name }} — macOS (Apple Silicon)

            **Download:** `ArNega-${{ github.ref_name }}-mac-arm64.dmg` below, then drag ArNega to Applications.

            This build is not notarized with Apple yet. If macOS blocks the first
            launch, open **System Settings → Privacy & Security** and choose
            **Open Anyway** (details in the
            [install guide](https://github.com/${{ github.repository }}/blob/main/docs/MACOS-DISTRIBUTION.md)).

            **Requirements:** macOS 12+ on Apple Silicon · [Ollama](https://ollama.com/download) ·
            one-time ~6 GB model download (`ollama pull qwen3-vl:8b-thinking-q4_K_M`, offered in-app).

            Verify your download against `SHA256SUMS.txt`.
