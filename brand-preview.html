<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ArNega brand preview</title>
<style>
  body { margin:0; background:#0C0E13; color:#E7EBF1; font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding:40px; }
  .row { display:flex; align-items:center; gap:40px; margin-bottom:48px; flex-wrap:wrap; }
  .card { background:#12151C; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; }
  .light { background:#F2F4F7; }
  h2 { font-size:14px; font-weight:600; color:#A8B1BE; text-transform:uppercase; letter-spacing:.08em; }
  img { display:block; }
</style>
</head>
<body>
  <h2>Symbol — 256 / 96 / 48 / 24</h2>
  <div class="row">
    <div class="card"><img src="packages/branding/assets/symbol.svg" width="256" height="256"></div>
    <div class="card"><img src="packages/branding/assets/symbol.svg" width="96" height="96"></div>
    <div class="card"><img src="packages/branding/assets/symbol.svg" width="48" height="48"></div>
    <div class="card"><img src="packages/branding/assets/symbol.svg" width="24" height="24"></div>
  </div>
  <h2>App icon 1024 (shown at 320) — dark & light context</h2>
  <div class="row">
    <div class="card"><img src="packages/branding/assets/icon-1024.svg" width="320" height="320"></div>
    <div class="card light"><img src="packages/branding/assets/icon-1024.svg" width="320" height="320"></div>
    <div class="card light"><img src="packages/branding/assets/icon-1024.svg" width="64" height="64"></div>
  </div>
  <h2>Favicon 64 / 32 / 16</h2>
  <div class="row">
    <div class="card"><img src="packages/branding/assets/favicon.svg" width="64" height="64"></div>
    <div class="card"><img src="packages/branding/assets/favicon.svg" width="32" height="32"></div>
    <div class="card"><img src="packages/branding/assets/favicon.svg" width="16" height="16"></div>
  </div>
  <h2>Wordmark — dark & light</h2>
  <div class="row">
    <div class="card"><img src="packages/branding/assets/wordmark.svg" width="480"></div>
    <div class="card light"><img src="packages/branding/assets/wordmark.svg" width="480"></div>
  </div>
</body>
</html>
