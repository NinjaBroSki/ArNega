# electron-builder configuration for ArNega.
#
# Signing: when no Developer ID certificate is available (the default for the
# public unsigned build), electron-builder falls back to ad-hoc signing, which
# is required for arm64 binaries to run at all. To produce a signed build
# later, provide the standard electron-builder env vars (CSC_LINK /
# CSC_KEY_PASSWORD) — see docs/MACOS-DISTRIBUTION.md.
appId: com.arnega.app
productName: ArNega
copyright: Copyright © 2026 ArNega

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - '!out/**/*.map'
  - package.json

asar: true
npmRebuild: false
electronLanguages:
  - en

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  minimumSystemVersion: '12.0'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    # Shown by macOS when the app first asks to capture the screen.
    NSCameraUsageDescription: 'ArNega does not use the camera.'
    NSMicrophoneUsageDescription: 'ArNega does not use the microphone.'

dmg:
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'
  writeUpdateInfo: false

publish: null
